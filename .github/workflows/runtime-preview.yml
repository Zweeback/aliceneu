name: Alice Runtime Preview

on:
  push:
    branches: [mvp/alice-greenfield]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid
      - name: Wait for preview
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Browser runtime diagnostics
        run: |
          mkdir -p artifacts
          node - <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const diagnostics = [];
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-gl=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
            });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            page.on('console', (msg) => diagnostics.push(`console.${msg.type()}: ${msg.text()}`));
            page.on('pageerror', (err) => diagnostics.push(`pageerror: ${err.stack || err.message}`));
            page.on('requestfailed', (req) => diagnostics.push(`requestfailed: ${req.url()} :: ${req.failure()?.errorText || 'unknown'}`));

            const response = await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded' });
            diagnostics.push(`navigation: ${response?.status() || 'no-response'} ${response?.url() || ''}`);

            const status = page.locator('.status-pill');
            await status.waitFor({ state: 'visible', timeout: 10000 });
            let statusText = '';
            const deadline = Date.now() + 60000;
            while (Date.now() < deadline) {
              statusText = (await status.innerText().catch(() => '')).trim();
              if (statusText && !statusText.startsWith('Alice wird geladen')) break;
              await page.waitForTimeout(1000);
            }

            const body = await page.locator('body').innerText().catch(() => '');
            const rootHtml = await page.locator('#root').innerHTML().catch(() => '<missing-root>');
            const canvasCount = await page.locator('canvas').count();
            diagnostics.push(`status: ${statusText}`);
            diagnostics.push(`bodyTextLength: ${body.length}`);
            diagnostics.push(`rootHtmlLength: ${rootHtml.length}`);
            diagnostics.push(`canvasCount: ${canvasCount}`);
            diagnostics.push(`rootHtml: ${rootHtml.slice(0, 4000)}`);

            await page.screenshot({ path: 'artifacts/alice-runtime.png', fullPage: true });
            fs.writeFileSync('artifacts/browser-diagnostics.txt', diagnostics.join('\n'));
            console.log(diagnostics.join('\n'));
            await browser.close();

            if (!body.trim()) throw new Error('Runtime rendered an empty body');
            if (!canvasCount) throw new Error('Three.js canvas missing');
            if (!statusText || statusText.startsWith('Alice wird geladen')) {
              throw new Error(`Alice model did not reach terminal state within 60s: ${statusText || '<empty>'}`);
            }
            if (!statusText.startsWith('Alice online')) {
              throw new Error(`Alice model failed to load: ${statusText}`);
            }
          })();
          NODE
      - name: Upload runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alice-runtime-proof
          path: |
            artifacts/alice-runtime.png
            artifacts/browser-diagnostics.txt
            preview.log
          if-no-files-found: warn
